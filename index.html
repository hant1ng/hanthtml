
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Hant 的个人主页">
<title>Hant | Personal Page</title>

<style>
/* ===== 全局样式 ===== */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: #fafafa;
  color: #101010;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Helvetica Neue", Arial,
    "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ===== 页面容器 ===== */
.page {
  width: 100%;
  max-width: 736px;
  margin: 0 auto;
  padding: 48px 0 80px;
}

/* ===== 个人资料卡片 ===== */
.profile-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 16px;
}

/* 头像 */
.avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #dfe2e6;
  display: block;
  margin-bottom: 16px;
  background: #f1f1f1;
}

/* 姓名 */
.name {
  margin: 0 0 8px;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.5px;
  color: #080808;
}

/* 个人简介 */
.bio {
  margin: 0;
  max-width: 680px;
  color: #374151;
  font-size: 15px;
  line-height: 1.65;
  font-weight: 400;
}

/* ===== 社交链接 ===== */
.social-links {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-top: 12px;
}

.social-links a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #6b7280;
  text-decoration: none;
  transition: color .15s ease;
}

.social-links a:hover {
  color: #111827;
}

.social-links svg {
  width: 18px;
  height: 18px;
  display: block;
}

.social-links .x-icon {
  font-size: 21px;
  line-height: 1;
  font-family: Arial, sans-serif;
  font-weight: 400;
}

/* ===== 预约卡片 ===== */
.booking-card {
  display: block;
  margin-top: 32px;
  padding: 20px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 7px;
  color: inherit;
  text-decoration: none;
  transition: border-color .15s ease,
              box-shadow .15s ease;
}

.booking-card:hover {
  border-color: #c9cdd3;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .025);
}

.booking-title {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 600;
  color: #111827;
}

.booking-description {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  color: #4b5563;
}

/* 时长标签 */
.duration {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 14px;
  padding: 1px 5px;
  border: 1px solid #d1d5db;
  border-radius: 5px;
  background: #fff;
  color: #111827;
  font-size: 12px;
  line-height: 18px;
}

.clock-icon {
  width: 13px;
  height: 13px;
}

/* ===== 手机端适配 ===== */
@media (max-width: 768px) {
  .page {
    max-width: none;
    padding: 24px 16px 50px;
  }

  .profile-card {
    padding: 16px;
  }

  .booking-card {
    margin-top: 24px;
    padding: 20px;
  }

  .bio {
    font-size: 14px;
  }
}

@media (max-width: 400px) {
  .page {
    padding: 16px 12px 40px;
  }

  .profile-card {
    padding: 16px;
  }

  .booking-card {
    padding: 16px;
  }
}
</style>
</head>

<body>

<main class="page">

  <!-- 个人资料 -->
  <section class="profile-card">

    <!-- 将图片地址替换为你的头像 -->
    <img
      class="avatar"

        </svg>

    </nav>
  </section>
