name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test anonymous browser-equivalent HSTV API
        shell: bash
        run: |
          set -euo pipefail
          cat > body.json <<'JSON'
          {
            "deviceInfo": {},
            "app": "hstv.life",
            "isStandalone": false,
            "theLink": "novaluenull",
            "uuid": "novalue",
            "url": "/sevenVideos?page=1&type=home_hot",
            "version": "260901"
          }
          JSON
          code=$(curl -sS -L --compressed --max-time 30 -o resp.json -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'Authorization: Bearer undefined'             -H 'Origin: https://hstv.life'             -H 'Referer: https://hstv.life/'             --data-binary @body.json             https://v2.cdn199.com/js || true)
          echo "HTTP=$code"
          cat resp.json
          echo

          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const obj=JSON.parse(fs.readFileSync('resp.json','utf8'));
          console.log('keys=',Object.keys(obj));
          if(!obj.r) process.exit(0);
          const raw=Buffer.from(obj.r,'base64');
          console.log('magic=',raw.subarray(0,8).toString());
          const salt=raw.subarray(8,16);
          let out=Buffer.alloc(0), prev=Buffer.alloc(0);
          while(out.length<48){
            const h=crypto.createHash('md5');
            h.update(prev); h.update(Buffer.from('xxx')); h.update(salt);
            prev=h.digest(); out=Buffer.concat([out,prev]);
          }
          const decipher=crypto.createDecipheriv('aes-256-cbc',out.subarray(0,32),out.subarray(32,48));
          const plain=Buffer.concat([decipher.update(raw.subarray(16)),decipher.final()]).toString('utf8');
          console.log('DECRYPTED='+plain.slice(0,20000));
          NODE
