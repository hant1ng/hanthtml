name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract HSTV config module
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o main.js https://hstv.life/main.531783010be35308.js
          python3 - <<'PY'
          import re
          s=open('main.js','r',encoding='utf-8',errors='ignore').read()

          # Find webpack module 5722 and print until the next module boundary.
          starts=[]
          for pat in [r'5722\s*\(', r'5722\s*:', r'5722\s*\{']:
              for m in re.finditer(pat,s):
                  starts.append(m.start())
          print('5722 starts',starts[:20])

          for idx,start in enumerate(sorted(set(starts))[:10]):
              # generous extraction around config module
              print('\n===== 5722 CANDIDATE',idx+1,'=====')
              print(s[max(0,start-1000):min(len(s),start+30000)].replace('\n',' '))

          print('\n===== AUTH WORD CONTEXTS =====')
          for i,m in enumerate(re.finditer(r'auth',s,re.I)):
              if i>=100: break
              frag=s[max(0,m.start()-1800):min(len(s),m.end()+2600)].replace('\n',' ')
              print('\nAUTHCTX',i+1,frag)

          print('\n===== BEARER CONTEXTS =====')
          for i,m in enumerate(re.finditer(r'Bearer',s)):
              if i>=30: break
              print(s[max(0,m.start()-2500):min(len(s),m.end()+3500)].replace('\n',' '))

          print('\n===== LONG STRING LITERALS NEAR CONFIG =====')
          # Strings that look token-like.
          vals=[]
          for m in re.finditer(r'["\']([A-Za-z0-9._~+\-/=]{20,500})["\']',s):
              x=m.group(1)
              if x in vals: continue
              if len(x)>=24:
                  vals.append(x)
          for x in vals[:300]:
              print(len(x),x)
          PY
