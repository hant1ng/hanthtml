name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test HSTV production API
        shell: bash
        run: |
          set -euo pipefail
          cat > body.json <<'JSON'
          {
            "deviceInfo": {},
            "app": "hstv.life",
            "isStandalone": false,
            "theLink": "novaluenull",
            "uuid": "novalue",
            "url": "/sevenVideos?page=1&type=home_hot",
            "version": "260901"
          }
          JSON

          for mode in noauth emptyauth; do
            echo "===== MODE $mode ====="
            if [ "$mode" = "emptyauth" ]; then
              code=$(curl -sS -L --compressed --max-time 30 -o "resp-$mode.json" -w '%{http_code}'                 -H 'Content-Type: application/json'                 -H 'Authorization: Bearer '                 --data-binary @body.json                 https://v2.cdn199.com/js || true)
            else
              code=$(curl -sS -L --compressed --max-time 30 -o "resp-$mode.json" -w '%{http_code}'                 -H 'Content-Type: application/json'                 --data-binary @body.json                 https://v2.cdn199.com/js || true)
            fi
            echo "HTTP=$code"
            echo "BODY:"
            head -c 1000 "resp-$mode.json" || true
            echo
          done

          cat > decrypt.js <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');

          function evpBytesToKey(password, salt, keyLen, ivLen) {
            let out=Buffer.alloc(0), prev=Buffer.alloc(0);
            while (out.length < keyLen + ivLen) {
              const md5=crypto.createHash('md5');
              md5.update(prev);
              md5.update(Buffer.from(password,'utf8'));
              md5.update(salt);
              prev=md5.digest();
              out=Buffer.concat([out,prev]);
            }
            return {key:out.subarray(0,keyLen), iv:out.subarray(keyLen,keyLen+ivLen)};
          }

          function decryptOpenSSL(ciphertext, password) {
            const raw=Buffer.from(ciphertext,'base64');
            if (raw.subarray(0,8).toString() !== 'Salted__') throw new Error('not Salted__');
            const salt=raw.subarray(8,16);
            const {key,iv}=evpBytesToKey(password,salt,32,16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const plain=Buffer.concat([decipher.update(raw.subarray(16)),decipher.final()]);
            return plain.toString('utf8');
          }

          for (const mode of ['noauth','emptyauth']) {
            try {
              const body=JSON.parse(fs.readFileSync('resp-'+mode+'.json','utf8'));
              console.log('\n===== DECRYPT '+mode+' =====');
              if (!body.r) { console.log('NO r FIELD',body); continue; }
              const text=decryptOpenSSL(body.r,'xxx');
              console.log(text.slice(0,10000));
            } catch(e) {
              console.log('\n===== DECRYPT '+mode+' ERROR =====');
              console.log(String(e));
            }
          }
          NODE

          node decrypt.js
