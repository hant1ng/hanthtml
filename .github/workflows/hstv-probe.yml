name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract HSTV auth decrypt and API routes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o main.js https://hstv.life/main.531783010be35308.js
          python3 - <<'PY'
          import re
          s=open('main.js','r',encoding='utf-8',errors='ignore').read()

          def contexts(term, limit=30, before=1800, after=3500):
              print(f'\n===== {term} =====')
              hits=list(re.finditer(re.escape(term),s,re.I))
              print('count',len(hits))
              for i,m in enumerate(hits[:limit]):
                  a=max(0,m.start()-before); b=min(len(s),m.end()+after)
                  print(f'\n--- HIT {i+1} ---\n{s[a:b].replace(chr(10)," ")}')

          for term in [
              'decrypt(l)',
              'decrypt(',
              '.decrypt(',
              'auth=',
              'M.auth',
              '.auth=',
              'version=',
              'M.version',
              '.version=',
              'videoDetails(',
              'this.videoDetails',
              'video(l)',
              'this.video(',
              'queryParams.videoType',
              'videoType:',
              'search_term_string',
              'searchText',
              'searchQuery',
              'm3u8s'
          ]:
              contexts(term)

          print('\n===== POST ROUTES =====')
          routes=[]
          for m in re.finditer(r'postHttpRequest\(\s*["\']([^"\']+)["\']',s):
              x=m.group(1)
              if x not in routes: routes.append(x)
          for x in routes: print(x)

          print('\n===== GET ROUTES =====')
          routes=[]
          for m in re.finditer(r'getHttpRequest\(\s*["\']([^"\']+)["\']',s):
              x=m.group(1)
              if x not in routes: routes.append(x)
          for x in routes: print(x)

          print('\n===== STRING ROUTES VIDEO-ish =====')
          vals=[]
          for m in re.finditer(r'["\'](/[^"\']{1,120})["\']',s):
              x=m.group(1)
              if re.search(r'(video|mtv|search|list|home|latest|recommend|seven)',x,re.I) and x not in vals:
                  vals.append(x)
          for x in vals: print(x)
          PY
