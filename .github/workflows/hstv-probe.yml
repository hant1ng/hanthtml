name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover HSTV lazy chunks
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://hstv.life
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o index.html "$BASE/"
          runtime=$(grep -oE 'runtime\.[A-Za-z0-9]+\.js' index.html | head -1)
          main=$(grep -oE 'main\.[A-Za-z0-9]+\.js' index.html | head -1)
          echo "runtime=$runtime main=$main"
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o runtime.js "$BASE/$runtime"
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o main.js "$BASE/$main"
          python3 - <<'PY'
          import re, json
          r=open('runtime.js','r',encoding='utf-8',errors='ignore').read()
          m=open('main.js','r',encoding='utf-8',errors='ignore').read()
          print('=== RUNTIME ===')
          print(r[:20000])
          print('\n=== LAZY IMPORT CONTEXTS IN MAIN ===')
          for term in ['loadChildren','import(','video','videos','embed','home']:
              print('\nTERM',term)
              for i,x in enumerate(re.finditer(re.escape(term),m,re.I)):
                  if i>=40: break
                  print(m[max(0,x.start()-1200):min(len(m),x.end()+1800)].replace('\n',' '))
                  print('---')
          PY
