name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch HSTV
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.2 Mobile/15E148 Safari/604.1'
          curl -L --compressed --max-time 30 -A "$UA"             -H 'Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8'             -D headers.txt -o page.html https://hstv.life/
          echo '=== RESPONSE HEADERS ==='
          sed -n '1,120p' headers.txt
          echo '=== SIZE / TYPE ==='
          wc -c page.html
          file page.html || true
          echo '=== TITLE ==='
          grep -oiE '<title[^>]*>[^<]*</title>' page.html | head -5 || true
          echo '=== SCRIPT SRCS ==='
          grep -oE '<script[^>]+src=["'"'"'][^"'"'"']+' page.html | sed -E 's/^.*src=["'"'"']//g' | head -80 || true
          echo '=== LINKS ==='
          grep -oE 'href=["'"'"'][^"'"'"']+' page.html | sed -E 's/^href=["'"'"']//g' | head -150 || true
          echo '=== FORMS ==='
          grep -oiE '<form[^>]*>|<input[^>]*>' page.html | head -100 || true
          echo '=== API / MEDIA TOKENS ==='
          grep -oE 'https?://[^"'"'"' <>]+|/api/[^"'"'"' <>]+|[^"'"'"' <>]+\.(m3u8|mp4)(\?[^"'"'"' <>]*)?' page.html | head -150 || true
          echo '=== HTML HEAD ==='
          sed -n '1,220p' page.html | head -220
