name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract HSTV API call sites
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o main.js https://hstv.life/main.531783010be35308.js
          python3 - <<'PY'
          import re
          s=open('main.js','r',encoding='utf-8',errors='ignore').read()

          for term in ['getHttpRequest','postHttpRequest','http.get(','http.post(','increaseCount','m3u8s','thumbnails','createdTime','videoType','keyword','search_term_string']:
              print('\n===== ',term,' =====')
              for n,m in enumerate(re.finditer(re.escape(term),s,re.I)):
                  if n>=80: break
                  a=max(0,m.start()-1200)
                  b=min(len(s),m.end()+2400)
                  print('\n---',n+1,'---\n',s[a:b].replace('\n',' '))

          print('\n===== PATH LITERALS =====')
          vals=[]
          for m in re.finditer(r'["\'](/[^"\']{1,120})["\']',s):
              x=m.group(1)
              if x not in vals:
                  vals.append(x)
          for x in vals:
              print(x)

          print('\n===== QUERY PARAM OBJECT KEYS AROUND videoType =====')
          for m in list(re.finditer('videoType',s,re.I))[:60]:
              a=max(0,m.start()-1600); b=min(len(s),m.end()+3200)
              print('\nCTX\n',s[a:b].replace('\n',' '))
          PY
