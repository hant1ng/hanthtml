name: HSTV Probe

on:
  push:
    paths:
      - '.github/workflows/hstv-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate HSTV config module
        shell: bash
        run: |
          set -euo pipefail
          curl -L --compressed --max-time 30 -A 'Mozilla/5.0' -o main.js https://hstv.life/main.531783010be35308.js
          python3 - <<'PY'
          import re
          s=open('main.js','r',encoding='utf-8',errors='ignore').read()
          marker='5722(en,ot,p){'
          start=s.find(marker)
          print('start',start)
          if start<0: raise SystemExit(1)
          brace=start+len(marker)-1
          depth=0; quote=None; esc=False; end=None
          for i in range(brace,len(s)):
              ch=s[i]
              if quote:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==quote: quote=None
                  continue
              if ch in ('"',"'","\x60"):
                  quote=ch; continue
              if ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          mod=s[start:end]
          print('module_len',len(mod))

          print('\n=== AUTH CONTEXTS INSIDE 5722 ===')
          hits=list(re.finditer('auth',mod,re.I))
          print('count',len(hits))
          for j,m in enumerate(hits):
              print('\nAUTH',j+1,mod[max(0,m.start()-800):min(len(mod),m.end()+1600)])

          print('\n=== ASSIGNMENT-LIKE KEYS ===')
          for key in ['auth','deviceInfo','language','app','version','httpName']:
              print('\nKEY',key)
              for m in re.finditer(r'(?:M\.)?'+re.escape(key)+r'\s*[:=]',mod):
                  print(mod[max(0,m.start()-500):min(len(mod),m.end()+1600)])

          print('\n=== IMPORT 5338 CONTEXT ===')
          for m in re.finditer(r'5338',s):
              print(s[max(0,m.start()-2500):min(len(s),m.end()+6000)])
              break
          PY
