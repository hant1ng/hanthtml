<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>施工水印相机</title>

<style>
:root{
  --bg:#14171c;
  --panel:#1b1f26;
  --panel2:#20242c;
  --border:#2a3039;
  --gold:#e3b84f;
  --gold2:#f0c85c;
  --blue:#277bc4;
  --blue2:#318bd5;
  --text:#f5f6f7;
  --sub:#a9b0ba;
  --muted:#707783;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    "Helvetica Neue",
    Arial,
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:0 16px 40px;
}

header{
  padding:28px 16px 18px;
  text-align:center;
}

header .eyebrow{
  font-size:11px;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:6px;
}

header h1{
  font-size:22px;
  font-weight:600;
  margin:0;
  letter-spacing:1px;
}

header .rule{
  width:36px;
  height:2px;
  background:var(--gold);
  margin:14px auto 0;
  border-radius:2px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.card h2{
  font-size:12px;
  letter-spacing:2px;
  color:var(--gold);
  margin:0 0 12px;
  font-weight:600;
}

.upload-zone{
  display:block;
  border:1.5px dashed var(--border);
  border-radius:12px;
  padding:22px 12px;
  text-align:center;
  color:var(--sub);
  cursor:pointer;
}

.upload-zone:active{
  border-color:var(--gold);
}

.upload-zone .icon{
  font-size:26px;
  margin-bottom:6px;
  color:var(--gold);
}

.upload-zone .sub{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

input[type=file]{
  display:none;
}

.thumbs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:2px;
}

.thumbs::-webkit-scrollbar{
  display:none;
}

.thumb{
  position:relative;
  flex:0 0 auto;
  width:56px;
  height:56px;
  border-radius:8px;
  overflow:hidden;
  border:2px solid transparent;
}

.thumb.active{
  border-color:var(--gold);
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumb .del{
  position:absolute;
  top:1px;
  right:1px;
  width:16px;
  height:16px;
  background:rgba(0,0,0,.65);
  color:#fff;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.count-pill{
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
}

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--sub);
  margin-bottom:6px;
}

.field input{
  width:100%;
  min-width:0;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:15px;
  padding:11px 10px;
  font-family:inherit;
}

.field input:focus{
  outline:none;
  border-color:var(--gold);
}

.row2{
  display:flex;
  gap:10px;
}

.row2 .field{
  flex:1;
  min-width:0;
}

.location-row{
  display:flex;
  gap:8px;
}

.location-row input{
  flex:1;
  min-width:0;
}

.gps-btn{
  flex:0 0 74px;
  border:1px solid var(--gold);
  background:rgba(227,184,79,.08);
  color:var(--gold);
  border-radius:10px;
  font-size:12px;
}

.weather-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.wopt{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 4px;
  text-align:center;
  color:var(--sub);
  font-size:12px;
  cursor:pointer;
}

.wopt.active{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(227,184,79,.08);
}

.wopt .wicon{
  font-size:18px;
  display:block;
  margin-bottom:4px;
}

.preview-wrap{
  background:var(--panel2);
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:180px;
}

.preview-wrap canvas{
  width:100%;
  height:auto;
  display:block;
}

.placeholder-note{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:4px;
}

button{
  font-family:inherit;
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  flex:1;
}

.btn-primary{
  background:var(--gold);
  color:#211903;
}

.btn-primary:active{
  background:#c99d35;
}

.btn-primary:disabled{
  background:#3a3a3a;
  color:#777;
}

.status{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  margin-top:10px;
  min-height:16px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="eyebrow">SITE RECORD</div>
  <h1>施工水印相机</h1>
  <div class="rule"></div>
</header>


<!-- 照片 -->
<div class="card">

  <h2>照片</h2>

  <label class="upload-zone" for="fileInput">
    <div class="icon">＋</div>
    <div>点击选择照片</div>
    <div class="sub">
      支持批量选择，水印将根据照片尺寸自动缩放
    </div>
  </label>

  <input
    type="file"
    id="fileInput"
    accept="image/*"
    multiple
  >

  <div class="thumbs" id="thumbs"></div>

  <div class="count-pill" id="countPill"></div>

</div>


<!-- 施工信息 -->
<div class="card">

  <h2>施工信息</h2>

  <div class="field">
    <label>单位名称</label>
    <input
      type="text"
      id="company"
      maxlength="40"
      value="湖北叶茂管道工程有限公司"
      placeholder="请输入单位名称"
    >
  </div>

  <div class="field">
    <label>施工内容</label>
    <input
      type="text"
      id="content"
      maxlength="50"
      placeholder="例：三层顶板钢筋绑扎"
    >
  </div>

  <div class="field">
    <label>施工地点</label>
    <input
      type="text"
      id="location"
      maxlength="40"
      placeholder="例：XX项目 3号楼 3F"
    >
  </div>

  <div class="field">
    <label>施工人数</label>
    <input
      type="number"
      id="workers"
      min="0"
      max="9999"
      value="12"
      placeholder="例：12"
    >
  </div>

</div>


<!-- 经纬度 -->
<div class="card">

  <h2>位置信息</h2>

  <div class="field">

    <label>经纬度</label>

    <div class="location-row">

      <input
        type="text"
        id="latitude"
        placeholder="纬度，例如 30.572547"
      >

      <input
        type="text"
        id="longitude"
        placeholder="经度，例如 114.305356"
      >

      <button
        class="gps-btn"
        id="gpsBtn"
        type="button"
      >
        获取位置
      </button>

    </div>

  </div>

</div>


<!-- 时间 -->
<div class="card">

  <h2>时间</h2>

  <div class="row2">

    <div class="field">
      <label>日期</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label>时间</label>
      <input type="time" id="time">
    </div>

  </div>

</div>


<!-- 天气 -->
<div class="card">

  <h2>天气</h2>

  <div class="weather-grid" id="weatherGrid"></div>

  <div class="field" style="margin-top:14px;">
    <label>温度 (℃)</label>
    <input
      type="number"
      id="temp"
      placeholder="例如 28"
      value="28"
    >
  </div>

</div>


<!-- 预览 -->
<div class="card">

  <h2>预览</h2>

  <div class="preview-wrap">
    <canvas id="previewCanvas"></canvas>
  </div>

  <div class="placeholder-note">
    水印会根据原始照片尺寸自动适配
  </div>

</div>


<div class="actions">

  <button
    class="btn-primary"
    id="downloadBtn"
  >
    下载水印照片
  </button>

</div>

<div
  class="status"
  id="status"
></div>

</div>


<script>

(function(){

/* =========================================================
   基础配置
========================================================= */

const GOLD = '#E3B84F';
const WHITE = '#F7F7F5';
const SUB = '#D1D5D8';

const weatherTypes = [

  {
    key:'sunny',
    label:'晴'
  },

  {
    key:'cloudy',
    label:'多云'
  },

  {
    key:'overcast',
    label:'阴'
  },

  {
    key:'rain',
    label:'雨'
  },

  {
    key:'snow',
    label:'雪'
  }

];

let activeWeather = 'sunny';

const photos = [];

let activeIndex = -1;


/* =========================================================
   DOM
========================================================= */

const el = id => document.getElementById(id);

const fileInput = el('fileInput');
const thumbsEl = el('thumbs');
const countPill = el('countPill');

const canvas = el('previewCanvas');
const ctx = canvas.getContext('2d');

const statusEl = el('status');


/* =========================================================
   天气图标
========================================================= */

function drawCloud(c,cx,cy,r,color){

  c.fillStyle = color;

  c.beginPath();

  c.ellipse(
    cx,
    cy+r*.15,
    r*.95,
    r*.55,
    0,
    0,
    Math.PI*2
  );

  c.fill();

  c.beginPath();

  c.arc(
    cx-r*.35,
    cy-r*.05,
    r*.5,
    0,
    Math.PI*2
  );

  c.fill();

  c.beginPath();

  c.arc(
    cx+r*.25,
    cy-r*.15,
    r*.6,
    0,
    Math.PI*2
  );

  c.fill();

}


function drawSun(c,cx,cy,r,color){

  c.fillStyle=color;

  c.beginPath();

  c.arc(
    cx,
    cy,
    r*.42,
    0,
    Math.PI*2
  );

  c.fill();

  c.strokeStyle=color;

  c.lineWidth=Math.max(1,r*.09);

  c.lineCap='round';

  for(let i=0;i<8;i++){

    const a=i*Math.PI/4;

    c.beginPath();

    c.moveTo(
      cx+Math.cos(a)*r*.62,
      cy+Math.sin(a)*r*.62
    );

    c.lineTo(
      cx+Math.cos(a)*r*.92,
      cy+Math.sin(a)*r*.92
    );

    c.stroke();

  }

}


function drawRain(c,cx,cy,r,color){

  c.strokeStyle=color;

  c.lineWidth=Math.max(1,r*.09);

  c.lineCap='round';

  for(let i=-1;i<=1;i++){

    const x=cx+i*r*.42;

    c.beginPath();

    c.moveTo(
      x,
      cy+r*.55
    );

    c.lineTo(
      x-r*.15,
      cy+r*.95
    );

    c.stroke();

  }

}


function drawSnow(c,cx,cy,r,color){

  c.fillStyle=color;

  for(let i=-1;i<=1;i++){

    c.beginPath();

    c.arc(
      cx+i*r*.42,
      cy+r*.78,
      Math.max(1,r*.09),
      0,
      Math.PI*2
    );

    c.fill();

  }

}


function drawWeatherIcon(c,type,cx,cy,r,color){

  switch(type){

    case 'sunny':

      drawSun(
        c,
        cx,
        cy,
        r,
        color
      );

      break;


    case 'cloudy':

      drawSun(
        c,
        cx-r*.28,
        cy-r*.22,
        r*.62,
        color
      );

      drawCloud(
        c,
        cx+r*.08,
        cy+r*.12,
        r*.82,
        color
      );

      break;


    case 'overcast':

      c.globalAlpha=.6;

      drawCloud(
        c,
        cx-r*.22,
        cy+r*.02,
        r*.6,
        color
      );

      c.globalAlpha=1;

      drawCloud(
        c,
        cx+r*.15,
        cy+r*.15,
        r*.75,
        color
      );

      break;


    case 'rain':

      drawCloud(
        c,
        cx,
        cy-r*.08,
        r*.78,
        color
      );

      drawRain(
        c,
        cx,
        cy,
        r,
        color
      );

      break;


    case 'snow':

      drawCloud(
        c,
        cx,
        cy-r*.08,
        r*.78,
        color
      );

      drawSnow(
        c,
        cx,
        cy,
        r,
        color
      );

      break;

  }

}


/* =========================================================
   天气选择器
========================================================= */

function buildWeatherGrid(){

  const grid=el('weatherGrid');

  grid.innerHTML='';

  weatherTypes.forEach(w=>{

    const d=document.createElement('div');

    d.className=
      'wopt'+
      (w.key===activeWeather?' active':'');

    const cvs=document.createElement('canvas');

    cvs.width=32;
    cvs.height=32;

    const c2=cvs.getContext('2d');

    drawWeatherIcon(
      c2,
      w.key,
      16,
      16,
      13,
      w.key===activeWeather
        ? GOLD
        : '#9AA1AC'
    );

    cvs.style.width='20px';
    cvs.style.height='20px';

    const span=document.createElement('span');

    span.className='wicon';

    span.appendChild(cvs);

    d.appendChild(span);

    const lbl=document.createElement('div');

    lbl.textContent=w.label;

    d.appendChild(lbl);

    d.onclick=()=>{

      activeWeather=w.key;

      buildWeatherGrid();

      renderPreview();

    };

    grid.appendChild(d);

  });

}


/* =========================================================
   经纬度图标
========================================================= */

function drawLocationIcon(
  c,
  cx,
  cy,
  size,
  color
){

  c.save();

  c.translate(
    cx-size/2,
    cy-size/2
  );

  const s=size/24;

  c.scale(s,s);

  c.beginPath();

  c.moveTo(12,2);

  c.bezierCurveTo(
    7.58,2,
    4,5.58,
    4,10
  );

  c.bezierCurveTo(
    4,15.25,
    12,22,
    12,22
  );

  c.bezierCurveTo(
    12,22,
    20,15.25,
    20,10
  );

  c.bezierCurveTo(
    20,5.58,
    16.42,2,
    12,2
  );

  c.closePath();

  c.fillStyle=color;

  c.fill();

  c.beginPath();

  c.arc(
    12,
    10,
    3,
    0,
    Math.PI*2
  );

  c.fillStyle='rgba(20,20,20,.55)';

  c.fill();

  c.restore();

}


/* =========================================================
   通用图标
========================================================= */

function drawDocumentIcon(
  c,
  x,
  y,
  size,
  color
){

  c.save();

  c.strokeStyle=color;
  c.lineWidth=size*.09;
  c.lineJoin='round';

  c.strokeRect(
    x-size*.34,
    y-size*.44,
    size*.68,
    size*.88
  );

  c.beginPath();

  c.moveTo(
    x-size*.18,
    y-size*.16
  );

  c.lineTo(
    x+size*.18,
    y-size*.16
  );

  c.moveTo(
    x-size*.18,
    y
  );

  c.lineTo(
    x+size*.18,
    y
  );

  c.moveTo(
    x-size*.18,
    y+size*.16
  );

  c.lineTo(
    x+size*.18,
    y+size*.16
  );

  c.stroke();

  c.restore();

}


function drawPeopleIcon(
  c,
  x,
  y,
  size,
  color
){

  c.save();

  c.strokeStyle=color;

  c.fillStyle=color;

  c.lineWidth=size*.08;

  c.beginPath();

  c.arc(
    x-size*.13,
    y-size*.17,
    size*.15,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.arc(
    x+size*.20,
    y-size*.12,
    size*.12,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.arc(
    x,
    y+size*.27,
    size*.29,
    Math.PI,
    Math.PI*2
  );

  c.stroke();

  c.restore();

}


function drawClockIcon(
  c,
  x,
  y,
  size,
  color
){

  c.save();

  c.strokeStyle=color;

  c.lineWidth=size*.08;

  c.beginPath();

  c.arc(
    x,
    y,
    size*.4,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.moveTo(
    x,
    y
  );

  c.lineTo(
    x,
    y-size*.22
  );

  c.moveTo(
    x,
    y
  );

  c.lineTo(
    x+size*.18,
    y+size*.12
  );

  c.stroke();

  c.restore();

}


/* =========================================================
   经纬度文字
========================================================= */

function getCoordinateText(){

  const lat=el('latitude').value.trim();

  const lng=el('longitude').value.trim();

  if(!lat && !lng){

    return '待定位';

  }

  if(lat && lng){

    return `${lat}°N, ${lng}°E`;

  }

  return `${lat || lng}°`;

}


/* =========================================================
   表单数据
========================================================= */

function pad(n){

  return n<10
    ? '0'+n
    : ''+n;

}


function weekdayCN(d){

  return [
    '日',
    '一',
    '二',
    '三',
    '四',
    '五',
    '六'
  ][d.getDay()];

}


function getFormData(){

  const dateVal=el('date').value;

  const timeVal=el('time').value;

  const dt=
    dateVal && timeVal
      ? new Date(`${dateVal}T${timeVal}`)
      : new Date();

  return {

    company:
      el('company').value.trim()
      || '单位名称',

    content:
      el('content').value.trim()
      || '施工内容待填写',

    location:
      el('location').value.trim()
      || '施工地点待填写',

    workers:
      el('workers').value.trim()
      || '0',

    latitude:
      el('latitude').value.trim(),

    longitude:
      el('longitude').value.trim(),

    coordinates:
      getCoordinateText(),

    temp:
      el('temp').value,

    weather:
      activeWeather,

    date:
      `${dt.getFullYear()}.${pad(dt.getMonth()+1)}.${pad(dt.getDate())}`,

    weekday:
      weekdayCN(dt),

    time:
      `${pad(dt.getHours())}:${pad(dt.getMinutes())}`

  };

}


/* =========================================================
   文字自动换行
========================================================= */

function wrapText(
  c,
  text,
  maxWidth,
  maxLines
){

  if(!text){

    return [];

  }

  const chars=Array.from(text);

  const lines=[];

  let line='';

  for(let i=0;i<chars.length;i++){

    const test=line+chars[i];

    if(
      c.measureText(test).width>maxWidth &&
      line.length>0
    ){

      lines.push(line);

      line=chars[i];

      if(lines.length===maxLines){

        line='';

        break;

      }

    }else{

      line=test;

    }

  }

  if(
    line &&
    lines.length<maxLines
  ){

    lines.push(line);

  }

  if(
    lines.length===maxLines &&
    lines.join('').length<chars.length
  ){

    let last=lines[maxLines-1];

    while(
      c.measureText(last+'…').width>maxWidth &&
      last.length>0
    ){

      last=last.slice(0,-1);

    }

    lines[maxLines-1]=last+'…';

  }

  return lines;

}


/* =========================================================
   水印核心
========================================================= */

function drawWatermark(
  targetCtx,
  img,
  W,
  H,
  data
){

  /*
    原图
  */

  targetCtx.drawImage(
    img,
    0,
    0,
    W,
    H
  );


  /*
    水印尺寸策略

    设计基准：
    560px 宽

    最大不会随着超大原图无限放大。

    最小根据照片尺寸自动缩小。
  */

  const panelW=Math.min(
    560,
    Math.max(
      300,
      W*0.40
    )
  );

  const scale=panelW/560;

  const panelH=405*scale;

  const margin=
    Math.max(
      18,
      W*.026
    );

  const left=margin;

  const top=
    H-panelH-margin;


  /*
    防止照片太矮
  */

  const safeTop=
    Math.max(
      H*.55,
      top
    );


  /*
    玻璃面板
  */

  targetCtx.save();

  targetCtx.globalAlpha=1;


  /*
    阴影
  */

  targetCtx.shadowColor=
    'rgba(0,0,0,.28)';

  targetCtx.shadowBlur=
    18*scale;

  targetCtx.shadowOffsetY=
    5*scale;


  /*
    半透明黑色背景
  */

  targetCtx.fillStyle=
    'rgba(12,16,20,.60)';

  targetCtx.beginPath();

  const radius=13*scale;

  targetCtx.roundRect(
    left,
    safeTop,
    panelW,
    panelH,
    radius
  );

  targetCtx.fill();


  /*
    关闭阴影
  */

  targetCtx.shadowColor='transparent';


  /*
    细白色边框
  */

  targetCtx.strokeStyle=
    'rgba(255,255,255,.48)';

  targetCtx.lineWidth=
    Math.max(
      1,
      1.1*scale
    );

  targetCtx.stroke();


  /*
    黄色标题竖线
  */

  const accentX=
    left+31*scale;

  const titleY=
    safeTop+57*scale;

  targetCtx.fillStyle=
    GOLD;

  targetCtx.fillRect(
    accentX,
    safeTop+32*scale,
    6*scale,
    38*scale
  );


  /*
    标题
  */

  targetCtx.fillStyle=WHITE;

  targetCtx.font=
    `600 ${31*scale}px "PingFang SC","Microsoft YaHei",sans-serif`;

  targetCtx.textBaseline='middle';

  targetCtx.fillText(
    '施工现场记录',
    left+57*scale,
    titleY
  );


  /*
    标题下方分割线
  */

  targetCtx.strokeStyle=
    'rgba(255,255,255,.35)';

  targetCtx.lineWidth=
    Math.max(
      1,
      .8*scale
    );

  targetCtx.beginPath();

  targetCtx.moveTo(
    left+28*scale,
    safeTop+92*scale
  );

  targetCtx.lineTo(
    left+panelW-28*scale,
    safeTop+92*scale
  );

  targetCtx.stroke();


  /*
    参数
  */

  const rowX=
    left+31*scale;

  const iconX=
    left+49*scale;

  const labelX=
    left+76*scale;

  const valueX=
    left+184*scale;

  const rowStart=
    safeTop+119*scale;

  const rowGap=
    42*scale;


  /*
    行绘制函数
  */

  function drawRow(
    index,
    label,
    value,
    iconType
  ){

    const y=
      rowStart+
      index*rowGap;


    /*
      图标
    */

    if(iconType==='document'){

      drawDocumentIcon(
        targetCtx,
        iconX,
        y,
        22*scale,
        WHITE
      );

    }

    if(iconType==='location'){

      drawLocationIcon(
        targetCtx,
        iconX,
        y,
        23*scale,
        WHITE
      );

    }

    if(iconType==='people'){

      drawPeopleIcon(
        targetCtx,
        iconX,
        y,
        24*scale,
        WHITE
      );

    }

    if(iconType==='gps'){

      drawLocationIcon(
        targetCtx,
        iconX,
        y,
        21*scale,
        '#69B7E8'
      );

    }


    /*
      标签
    */

    targetCtx.fillStyle=GOLD;

    targetCtx.font=
      `600 ${16*scale}px "PingFang SC","Microsoft YaHei",sans-serif`;

    targetCtx.textBaseline='middle';

    targetCtx.fillText(
      label,
      labelX,
      y
    );


    /*
      内容
    */

    targetCtx.fillStyle=WHITE;

    targetCtx.font=
      `400 ${16*scale}px "PingFang SC","Microsoft YaHei",sans-serif`;

    const maxTextW=
      panelW-
      (valueX-left)-
      28*scale;

    const lines=
      wrapText(
        targetCtx,
        value,
        maxTextW,
        1
      );

    targetCtx.fillText(
      lines[0] || '',
      valueX,
      y
    );


    /*
      分割线
    */

    if(index<3){

      targetCtx.strokeStyle=
        'rgba(255,255,255,.17)';

      targetCtx.lineWidth=
        Math.max(
          1,
          .7*scale
        );

      targetCtx.beginPath();

      targetCtx.moveTo(
        left+28*scale,
        y+21*scale
      );

      targetCtx.lineTo(
        left+panelW-28*scale,
        y+21*scale
      );

      targetCtx.stroke();

    }

  }


  /*
    施工内容
  */

  drawRow(
    0,
    '施工内容：',
    data.content,
    'document'
  );


  /*
    施工地点
  */

  drawRow(
    1,
    '施工地点：',
    data.location,
    'location'
  );


  /*
    施工人数
  */

  drawRow(
    2,
    '施工人数：',
    `${data.workers} 人`,
    'people'
  );


  /*
    经纬度
  */

  drawRow(
    3,
    '经纬度：',
    data.coordinates,
    'gps'
  );


  /*
    底部蓝色信息栏
  */

  const barY=
    safeTop+
    panelH-
    77*scale;

  const barH=
    47*scale;


  /*
    蓝色半透明底
  */

  targetCtx.fillStyle=
    'rgba(37,128,200,.78)';

  targetCtx.fillRect(
    left,
    barY,
    panelW,
    barH
  );


  /*
    日期时间
  */

  drawClockIcon(
    targetCtx,
    left+48*scale,
    barY+barH/2,
    23*scale,
    WHITE
  );

  targetCtx.fillStyle=WHITE;

  targetCtx.font=
    `400 ${15*scale}px "PingFang SC","Microsoft YaHei",sans-serif`;

  targetCtx.textBaseline='middle';

  targetCtx.fillText(
    `${data.date} (${data.weekday}) · ${data.time}`,
    left+70*scale,
    barY+barH/2
  );


  /*
    天气
  */

  const weatherLabel=
    (
      weatherTypes.find(
        w=>w.key===data.weather
      ) || {}
    ).label || '';


  const weatherText=
    data.temp
      ? `${weatherLabel}  ${data.temp}℃`
      : weatherLabel;


  const weatherFontSize=
    15*scale;

  targetCtx.font=
    `400 ${weatherFontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

  const weatherTextW=
    targetCtx.measureText(weatherText).width;

  const weatherX=
    left+
    panelW-
    weatherTextW-
    45*scale;


  drawWeatherIcon(
    targetCtx,
    data.weather,
    weatherX,
    barY+barH/2,
    13*scale,
    '#FFD447'
  );

  targetCtx.fillStyle=WHITE;

  targetCtx.fillText(
    weatherText,
    weatherX+25*scale,
    barY+barH/2
  );


  /*
    公司名称区域
  */

  targetCtx.fillStyle=
    'rgba(0,0,0,.18)';

  targetCtx.fillRect(
    left,
    barY+barH,
    panelW,
    62*scale
  );


  targetCtx.fillStyle=WHITE;

  targetCtx.font=
    `500 ${16*scale}px "PingFang SC","Microsoft YaHei",sans-serif`;

  targetCtx.textAlign='center';

  targetCtx.fillText(
    data.company,
    left+panelW/2,
    barY+barH+31*scale
  );

  targetCtx.textAlign='left';

  targetCtx.restore();

}


/* =========================================================
   示例底图
========================================================= */

function drawPlaceholder(
  c,
  W,
  H
){

  const g=
    c.createLinearGradient(
      0,
      0,
      W,
      H
    );

  g.addColorStop(
    0,
    '#4a535b'
  );

  g.addColorStop(
    1,
    '#171a1f'
  );

  c.fillStyle=g;

  c.fillRect(
    0,
    0,
    W,
    H
  );


  c.fillStyle=
    'rgba(255,255,255,.06)';

  for(let i=0;i<7;i++){

    c.beginPath();

    c.arc(
      W*(.12+i*.13),
      H*.35,
      W*.055,
      0,
      Math.PI*2
    );

    c.fill();

  }

}


/* =========================================================
   预览
========================================================= */

function renderPreview(){

  const data=getFormData();

  let W;
  let H;
  let img;


  if(
    activeIndex>=0 &&
    photos[activeIndex]
  ){

    img=photos[activeIndex].img;

    W=img.naturalWidth;
    H=img.naturalHeight;

    canvas.width=W;
    canvas.height=H;

    drawWatermark(
      ctx,
      img,
      W,
      H,
      data
    );

  }else{

    W=1200;
    H=900;

    canvas.width=W;
    canvas.height=H;

    const tmp=
      document.createElement('canvas');

    tmp.width=W;
    tmp.height=H;

    const tctx=
      tmp.getContext('2d');

    drawPlaceholder(
      tctx,
      W,
      H
    );

    drawWatermark(
      ctx,
      tmp,
      W,
      H,
      data
    );

  }

}


/* =========================================================
   上传照片
========================================================= */

fileInput.onchange=function(e){

  const files=
    Array.from(
      e.target.files || []
    );

  files.forEach(file=>{

    const reader=
      new FileReader();

    reader.onload=function(ev){

      const img=
        new Image();

      img.onload=function(){

        photos.push({
          img:img,
          name:file.name
        });

        if(activeIndex===-1){

          activeIndex=
            photos.length-1;

        }

        renderThumbs();

        renderPreview();

      };

      img.src=ev.target.result;

    };

    reader.readAsDataURL(file);

  });

  fileInput.value='';

};


/* =========================================================
   缩略图
========================================================= */

function renderThumbs(){

  thumbsEl.innerHTML='';

  photos.forEach((p,i)=>{

    const d=
      document.createElement('div');

    d.className=
      'thumb'+
      (i===activeIndex?' active':'');


    const img=
      document.createElement('img');

    img.src=p.img.src;

    d.appendChild(img);


    const del=
      document.createElement('div');

    del.className='del';

    del.textContent='×';


    del.onclick=function(ev){

      ev.stopPropagation();

      photos.splice(i,1);

      if(
        activeIndex>=photos.length
      ){

        activeIndex=
          photos.length-1;

      }

      renderThumbs();

      renderPreview();

    };


    d.appendChild(del);


    d.onclick=function(){

      activeIndex=i;

      renderThumbs();

      renderPreview();

    };


    thumbsEl.appendChild(d);

  });


  countPill.textContent=
    photos.length
      ? `已选择 ${photos.length} 张照片`
      : '';

}


/* =========================================================
   表单实时更新
========================================================= */

[
  'company',
  'content',
  'location',
  'workers',
  'latitude',
  'longitude',
  'temp',
  'date',
  'time'
].forEach(id=>{

  el(id).addEventListener(
    'input',
    renderPreview
  );

});


/* =========================================================
   设置当前时间
========================================================= */

function setNow(){

  const d=new Date();

  el('date').value=
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  el('time').value=
    `${pad(d.getHours())}:${pad(d.getMinutes())}`;

}


/* =========================================================
   获取手机 GPS
========================================================= */

el('gpsBtn').onclick=function(){

  const btn=this;

  if(!navigator.geolocation){

    statusEl.textContent=
      '当前浏览器不支持定位功能';

    return;

  }

  btn.disabled=true;

  btn.textContent='定位中';

  statusEl.textContent=
    '正在获取当前位置…';


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat=
        position.coords.latitude;

      const lng=
        position.coords.longitude;


      el('latitude').value=
        lat.toFixed(6);

      el('longitude').value=
        lng.toFixed(6);


      renderPreview();


      statusEl.textContent=
        '定位成功';


      btn.disabled=false;

      btn.textContent='获取位置';

    },


    function(error){

      console.log(error);

      statusEl.textContent=
        '定位失败，请手动填写经纬度';


      btn.disabled=false;

      btn.textContent='获取位置';

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

};


/* =========================================================
   下载
========================================================= */

el('downloadBtn').onclick=async function(){

  if(photos.length===0){

    statusEl.textContent=
      '请先选择至少一张照片';

    return;

  }


  const data=getFormData();

  const btn=this;

  btn.disabled=true;


  /*
    单张
  */

  if(photos.length===1){

    statusEl.textContent=
      '正在生成照片…';


    const img=
      photos[0].img;


    const off=
      document.createElement('canvas');

    off.width=
      img.naturalWidth;

    off.height=
      img.naturalHeight;


    drawWatermark(
      off.getContext('2d'),
      img,
      off.width,
      off.height,
      data
    );


    off.toBlob(
      function(blob){

        const url=
          URL.createObjectURL(blob);

        const a=
          document.createElement('a');

        a.href=url;

        a.download=
          `施工记录_${data.date}_${data.time.replace(':','')}.jpg`;

        a.click();

        setTimeout(
          ()=>URL.revokeObjectURL(url),
          1000
        );


        statusEl.textContent=
          '已下载';

        btn.disabled=false;

      },
      'image/jpeg',
      .94
    );


    return;

  }


  /*
    多张
  */

  for(
    let i=0;
    i<photos.length;
    i++
  ){

    statusEl.textContent=
      `正在生成 ${i+1}/${photos.length}…`;


    const img=
      photos[i].img;


    const off=
      document.createElement('canvas');

    off.width=
      img.naturalWidth;

    off.height=
      img.naturalHeight;


    drawWatermark(
      off.getContext('2d'),
      img,
      off.width,
      off.height,
      data
    );


    const blob=
      await new Promise(resolve=>{

        off.toBlob(
          resolve,
          'image/jpeg',
          .94
        );

      });


    const url=
      URL.createObjectURL(blob);


    const a=
      document.createElement('a');

    a.href=url;

    a.download=
      `施工记录_${i+1}_${data.date}_${data.time.replace(':','')}.jpg`;

    a.click();


    setTimeout(
      ()=>URL.revokeObjectURL(url),
      1000
    );


    await new Promise(
      resolve=>setTimeout(
        resolve,
        350
      )
    );

  }


  statusEl.textContent=
    `已下载全部 ${photos.length} 张照片`;

  btn.disabled=false;

};


/* =========================================================
   初始化
========================================================= */

buildWeatherGrid();

setNow();

renderPreview();

})();

</script>
