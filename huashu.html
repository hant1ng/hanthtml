<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>施工水印相机</title>

<style>
:root{
  --bg:#14171c;
  --panel:#1b1f26;
  --panel2:#20242c;
  --border:#2a2f38;

  --gold:#d8ae55;
  --gold2:#e4bd69;

  --text:#f5f5f2;
  --sub:#c7cbd0;
  --muted:#8d949e;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:0 16px 40px;
}

header{
  padding:28px 16px 18px;
  text-align:center;
}

header .eyebrow{
  font-size:11px;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:6px;
}

header h1{
  font-size:22px;
  font-weight:600;
  margin:0;
  letter-spacing:1px;
}

header .rule{
  width:36px;
  height:2px;
  background:var(--gold);
  margin:14px auto 0;
  border-radius:2px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.card h2{
  font-size:12px;
  letter-spacing:2px;
  color:var(--gold);
  margin:0 0 12px;
  font-weight:600;
}

.upload-zone{
  display:block;
  border:1.5px dashed var(--border);
  border-radius:12px;
  padding:22px 12px;
  text-align:center;
  color:#9aa1ac;
  cursor:pointer;
}

.upload-zone:active{
  border-color:var(--gold);
}

.upload-zone .icon{
  font-size:26px;
  margin-bottom:6px;
  color:var(--gold);
}

.upload-zone .sub{
  font-size:12px;
  color:#666d78;
  margin-top:4px;
}

input[type=file]{
  display:none;
}

.thumbs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:12px;
  padding-bottom:2px;
}

.thumbs::-webkit-scrollbar{
  display:none;
}

.thumb{
  position:relative;
  flex:0 0 auto;
  width:56px;
  height:56px;
  border-radius:8px;
  overflow:hidden;
  border:2px solid transparent;
}

.thumb.active{
  border-color:var(--gold);
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumb .del{
  position:absolute;
  top:1px;
  right:1px;
  width:16px;
  height:16px;
  background:rgba(0,0,0,.65);
  color:#fff;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.count-pill{
  font-size:11px;
  color:#666d78;
  margin-top:8px;
}

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  font-size:12px;
  color:#9aa1ac;
  margin-bottom:6px;
}

.field input{
  width:100%;
  min-width:0;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:15px;
  padding:11px 10px;
  font-family:inherit;
}

.field input:focus{
  outline:none;
  border-color:#8a7442;
}

.row2{
  display:flex;
  gap:10px;
}

.row2 .field{
  flex:1;
  min-width:0;
}

.weather-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.wopt{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 4px;
  text-align:center;
  color:#9aa1ac;
  font-size:12px;
  cursor:pointer;
}

.wopt.active{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(216,174,85,.08);
}

.wopt .wicon{
  font-size:18px;
  display:block;
  margin-bottom:4px;
}

.preview-wrap{
  background:var(--panel2);
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:180px;
}

.preview-wrap canvas{
  width:100%;
  height:auto;
  display:block;
}

.placeholder-note{
  font-size:11px;
  color:#666d78;
  text-align:center;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:4px;
}

button{
  font-family:inherit;
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  flex:1;
}

.btn-primary{
  background:#d6ad59;
  color:#1b1503;
}

.btn-primary:active{
  background:#a98a48;
}

.btn-primary:disabled{
  background:#3a3a3a;
  color:#777;
}

.status{
  font-size:12px;
  color:#666d78;
  text-align:center;
  margin-top:10px;
  min-height:16px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="eyebrow">SITE RECORD</div>
  <h1>施工水印相机</h1>
  <div class="rule"></div>
</header>


<!-- 照片 -->
<div class="card">

  <h2>照片</h2>

  <label class="upload-zone" for="fileInput">
    <div class="icon">＋</div>
    <div>点击选择照片</div>
    <div class="sub">
      支持批量选择，水印将按每张照片尺寸自动缩放
    </div>
  </label>

  <input
    type="file"
    id="fileInput"
    accept="image/*"
    multiple
  >

  <div class="thumbs" id="thumbs"></div>

  <div class="count-pill" id="countPill"></div>

</div>


<!-- 施工信息 -->
<div class="card">

  <h2>施工信息</h2>

  <div class="field">
    <label>单位名称</label>
    <input
      type="text"
      id="company"
      maxlength="30"
      value="湖北叶茂管道工程有限公司"
      placeholder="例：湖北叶茂管道工程有限公司"
    >
  </div>

  <div class="field">
    <label>施工内容</label>
    <input
      type="text"
      id="content"
      maxlength="40"
      placeholder="例：三层顶板钢筋绑扎"
    >
  </div>

  <div class="field">
    <label>施工地点</label>
    <input
      type="text"
      id="location"
      maxlength="40"
      placeholder="例：XX项目 3号楼 3F"
    >
  </div>

  <div class="row2">

    <div class="field">
      <label>施工人数</label>
      <input
        type="number"
        id="workers"
        min="0"
        placeholder="例：12"
        value="12"
      >
    </div>

    <div class="field">
      <label>温度（℃）</label>
      <input
        type="number"
        id="temp"
        placeholder="28"
        value="28"
      >
    </div>

  </div>

  <div class="field">
    <label>经纬度</label>
    <input
      type="text"
      id="coordinates"
      value="30.572547°N, 114.305356°E"
      placeholder="例：30.572547°N, 114.305356°E"
    >
  </div>

  <div class="row2">

    <div class="field">
      <label>日期</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label>时间</label>
      <input type="time" id="time">
    </div>

  </div>

</div>


<!-- 天气 -->
<div class="card">

  <h2>天气</h2>

  <div class="weather-grid" id="weatherGrid"></div>

</div>


<!-- 预览 -->
<div class="card">

  <h2>预览</h2>

  <div class="preview-wrap">
    <canvas id="previewCanvas"></canvas>
  </div>

  <div class="placeholder-note">
    未选择照片时为示例底图，水印比例与真实照片一致
  </div>

</div>


<div class="actions">

  <button
    class="btn-primary"
    id="downloadBtn"
  >
    下载水印照片
  </button>

</div>

<div
  class="status"
  id="status"
></div>

</div>


<script>

(function(){

const GOLD = '#D8AE55';
const WHITE = '#F5F5F2';
const SUB = '#D0D2D4';
const MUTED = '#A4A8AD';

const weatherTypes = [

  {
    key:'sunny',
    label:'晴'
  },

  {
    key:'cloudy',
    label:'多云'
  },

  {
    key:'overcast',
    label:'阴'
  },

  {
    key:'rain',
    label:'雨'
  },

  {
    key:'snow',
    label:'雪'
  }

];


let activeWeather = 'sunny';

const photos = [];

let activeIndex = -1;


const el = id => document.getElementById(id);

const fileInput = el('fileInput');

const thumbsEl = el('thumbs');

const countPill = el('countPill');

const canvas = el('previewCanvas');

const ctx = canvas.getContext('2d');

const statusEl = el('status');



/* =========================================================
   精致线性 ICON
========================================================= */

function iconSetup(c, size){

  c.save();

  c.strokeStyle = GOLD;

  c.fillStyle = GOLD;

  c.lineWidth = Math.max(1.2, size * 0.085);

  c.lineCap = 'round';

  c.lineJoin = 'round';

}


/* 标题：文档 */

function drawDocumentIcon(c,x,y,size){

  iconSetup(c,size);

  const s = size / 24;

  c.translate(x-size/2,y-size/2);

  c.scale(s,s);

  c.beginPath();

  c.roundRect(
    5,
    3,
    14,
    18,
    2
  );

  c.stroke();

  c.beginPath();

  c.moveTo(9,8);

  c.lineTo(15,8);

  c.moveTo(9,12);

  c.lineTo(16,12);

  c.moveTo(9,16);

  c.lineTo(14,16);

  c.stroke();

  c.restore();

}


/* 施工内容：剪贴板 */

function drawClipboardIcon(c,x,y,size){

  iconSetup(c,size);

  const s = size/24;

  c.translate(x-size/2,y-size/2);

  c.scale(s,s);

  c.beginPath();

  c.roundRect(
    5,
    5,
    14,
    16,
    2
  );

  c.stroke();

  c.beginPath();

  c.roundRect(
    9,
    2.5,
    6,
    4,
    1.5
  );

  c.stroke();

  c.beginPath();

  c.moveTo(9,11);

  c.lineTo(15,11);

  c.moveTo(9,15);

  c.lineTo(15,15);

  c.stroke();

  c.restore();

}


/* 地点：定位 */

function drawLocationIcon(c,x,y,size){

  iconSetup(c,size);

  const s=size/24;

  c.translate(x-size/2,y-size/2);

  c.scale(s,s);

  c.beginPath();

  c.moveTo(12,21);

  c.bezierCurveTo(
    12,
    21,
    5,
    14.5,
    5,
    9.5
  );

  c.bezierCurveTo(
    5,
    5.7,
    8.1,
    3,
    12,
    3
  );

  c.bezierCurveTo(
    15.9,
    3,
    19,
    5.7,
    19,
    9.5
  );

  c.bezierCurveTo(
    19,
    14.5,
    12,
    21,
    12,
    21
  );

  c.stroke();

  c.beginPath();

  c.arc(
    12,
    9.5,
    2.4,
    0,
    Math.PI*2
  );

  c.stroke();

  c.restore();

}


/* 人数：两个人 */

function drawPeopleIcon(c,x,y,size){

  iconSetup(c,size);

  const s=size/24;

  c.translate(x-size/2,y-size/2);

  c.scale(s,s);

  c.beginPath();

  c.arc(
    9,
    8,
    3,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.arc(
    16,
    9,
    2.5,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.moveTo(3.5,20);

  c.bezierCurveTo(
    3.5,
    15.5,
    6,
    13.5,
    9,
    13.5
  );

  c.bezierCurveTo(
    12,
    13.5,
    14.5,
    15.5,
    14.5,
    20
  );

  c.stroke();

  c.beginPath();

  c.moveTo(13.5,14.5);

  c.bezierCurveTo(
    17.5,
    13.5,
    20.5,
    16,
    20.5,
    20
  );

  c.stroke();

  c.restore();

}


/* 经纬度：十字定位 */

function drawCoordinateIcon(c,x,y,size){

  iconSetup(c,size);

  const s=size/24;

  c.translate(x-size/2,y-size/2);

  c.scale(s,s);

  c.beginPath();

  c.arc(
    12,
    12,
    6,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.moveTo(12,2);

  c.lineTo(12,6);

  c.moveTo(12,18);

  c.lineTo(12,22);

  c.moveTo(2,12);

  c.lineTo(6,12);

  c.moveTo(18,12);

  c.lineTo(22,12);

  c.stroke();

  c.beginPath();

  c.arc(
    12,
    12,
    1.4,
    0,
    Math.PI*2
  );

  c.fill();

  c.restore();

}


/* 时间 */

function drawClockIcon(c,x,y,size){

  iconSetup(c,size);

  const s=size/24;

  c.translate(x-size/2,y-size/2);

  c.scale(s,s);

  c.beginPath();

  c.arc(
    12,
    12,
    8.5,
    0,
    Math.PI*2
  );

  c.stroke();

  c.beginPath();

  c.moveTo(12,7);

  c.lineTo(12,12);

  c.lineTo(15.5,14);

  c.stroke();

  c.restore();

}


/* =========================================================
   天气 ICON
========================================================= */

function drawCloud(c,cx,cy,r,color){

  c.save();

  c.fillStyle=color;

  c.beginPath();

  c.ellipse(
    cx,
    cy+r*.15,
    r*.95,
    r*.55,
    0,
    0,
    Math.PI*2
  );

  c.fill();

  c.beginPath();

  c.arc(
    cx-r*.35,
    cy-r*.05,
    r*.5,
    0,
    Math.PI*2
  );

  c.fill();

  c.beginPath();

  c.arc(
    cx+r*.25,
    cy-r*.15,
    r*.6,
    0,
    Math.PI*2
  );

  c.fill();

  c.restore();

}


function drawSun(c,cx,cy,r,color){

  c.save();

  c.strokeStyle=color;

  c.fillStyle=color;

  c.lineWidth=Math.max(1,r*.08);

  c.lineCap='round';

  c.beginPath();

  c.arc(
    cx,
    cy,
    r*.4,
    0,
    Math.PI*2
  );

  c.fill();

  for(let i=0;i<8;i++){

    const a=i*Math.PI/4;

    c.beginPath();

    c.moveTo(
      cx+Math.cos(a)*r*.65,
      cy+Math.sin(a)*r*.65
    );

    c.lineTo(
      cx+Math.cos(a)*r*.95,
      cy+Math.sin(a)*r*.95
    );

    c.stroke();

  }

  c.restore();

}


function drawRain(c,cx,cy,r,color){

  c.save();

  c.strokeStyle=color;

  c.lineWidth=Math.max(1,r*.09);

  c.lineCap='round';

  for(let i=-1;i<=1;i++){

    const xx=cx+i*r*.4;

    c.beginPath();

    c.moveTo(
      xx,
      cy+r*.5
    );

    c.lineTo(
      xx-r*.12,
      cy+r*.9
    );

    c.stroke();

  }

  c.restore();

}


function drawSnow(c,cx,cy,r,color){

  c.save();

  c.fillStyle=color;

  for(let i=-1;i<=1;i++){

    c.beginPath();

    c.arc(
      cx+i*r*.4,
      cy+r*.75,
      Math.max(1,r*.08),
      0,
      Math.PI*2
    );

    c.fill();

  }

  c.restore();

}


function drawWeatherIcon(
  c,
  type,
  cx,
  cy,
  r,
  color
){

  if(type==='sunny'){

    drawSun(
      c,
      cx,
      cy,
      r,
      color
    );

  }

  else if(type==='cloudy'){

    drawSun(
      c,
      cx-r*.28,
      cy-r*.22,
      r*.62,
      color
    );

    drawCloud(
      c,
      cx+r*.08,
      cy+r*.12,
      r*.82,
      color
    );

  }

  else if(type==='overcast'){

    drawCloud(
      c,
      cx-r*.22,
      cy,
      r*.6,
      color
    );

    drawCloud(
      c,
      cx+r*.15,
      cy+r*.1,
      r*.72,
      color
    );

  }

  else if(type==='rain'){

    drawCloud(
      c,
      cx,
      cy-r*.1,
      r*.78,
      color
    );

    drawRain(
      c,
      cx,
      cy,
      r,
      color
    );

  }

  else if(type==='snow'){

    drawCloud(
      c,
      cx,
      cy-r*.1,
      r*.78,
      color
    );

    drawSnow(
      c,
      cx,
      cy,
      r,
      color
    );

  }

}


/* =========================================================
   天气选择
========================================================= */

function buildWeatherGrid(){

  const grid=el('weatherGrid');

  grid.innerHTML='';

  weatherTypes.forEach(w=>{

    const d=document.createElement('div');

    d.className=
      'wopt '+
      (w.key===activeWeather?'active':'');

    const cvs=document.createElement('canvas');

    cvs.width=40;

    cvs.height=40;

    const c=cvs.getContext('2d');

    drawWeatherIcon(
      c,
      w.key,
      20,
      20,
      15,
      w.key===activeWeather
        ? GOLD
        : '#9AA1AC'
    );

    cvs.style.width='22px';

    cvs.style.height='22px';

    const span=document.createElement('span');

    span.className='wicon';

    span.appendChild(cvs);

    d.appendChild(span);

    const lbl=document.createElement('div');

    lbl.textContent=w.label;

    d.appendChild(lbl);

    d.onclick=()=>{

      activeWeather=w.key;

      buildWeatherGrid();

      renderPreview();

    };

    grid.appendChild(d);

  });

}


/* =========================================================
   文字换行
========================================================= */

function wrapLines(
  c,
  text,
  maxWidth,
  maxLines
){

  if(!text)return [];

  const chars=Array.from(text);

  const lines=[];

  let cur='';

  for(let i=0;i<chars.length;i++){

    const test=cur+chars[i];

    if(
      c.measureText(test).width>maxWidth &&
      cur.length>0
    ){

      lines.push(cur);

      cur=chars[i];

      if(lines.length===maxLines){

        cur='';

        break;

      }

    }else{

      cur=test;

    }

  }

  if(
    cur &&
    lines.length<maxLines
  ){

    lines.push(cur);

  }

  return lines;

}


function pad(n){

  return n<10
    ? '0'+n
    : ''+n;

}


function weekdayCN(d){

  return [
    '周日',
    '周一',
    '周二',
    '周三',
    '周四',
    '周五',
    '周六'
  ][d.getDay()];

}


/* =========================================================
   表单
========================================================= */

function getFormData(){

  const dateVal=el('date').value;

  const timeVal=el('time').value;

  const dt=
    dateVal&&timeVal
      ? new Date(`${dateVal}T${timeVal}`)
      : new Date();

  return {

    company:
      el('company').value.trim(),

    content:
      el('content').value.trim() ||
      '施工内容待填写',

    location:
      el('location').value.trim() ||
      '施工地点待填写',

    workers:
      el('workers').value.trim() ||
      '0',

    coordinates:
      el('coordinates').value.trim() ||
      '待定位',

    temp:
      el('temp').value.trim(),

    weather:
      activeWeather,

    dateStr:
      `${dt.getFullYear()}.${pad(dt.getMonth()+1)}.${pad(dt.getDate())} ${weekdayCN(dt)}`,

    timeStr:
      `${pad(dt.getHours())}:${pad(dt.getMinutes())}`

  };

}


/* =========================================================
   核心水印
========================================================= */

function drawWatermark(
  targetCtx,
  img,
  W,
  H,
  data
){

  targetCtx.drawImage(
    img,
    0,
    0,
    W,
    H
  );


  /*
    所有尺寸以照片宽度 W 为基础。
    这样竖图和横图都会自动缩放。
  */

  const scale=W/1200;


  /*
    水印最大宽度。
    竖图稍微窄一些，避免喧宾夺主。
  */

  const panelW=
    Math.min(
      W*0.43,
      560
    );


  const left=
    Math.max(
      W*0.025,
      18*scale
    );


  const bottom=
    Math.max(
      H*0.035,
      22*scale
    );


  const titleSize=
    Math.max(
      20,
      W*0.021
    );


  const labelSize=
    Math.max(
      13,
      W*0.012
    );


  const valueSize=
    Math.max(
      13,
      W*0.0135
    );


  const companySize=
    Math.max(
      12,
      W*0.012
    );


  const iconSize=
    Math.max(
      15,
      W*0.016
    );


  const rowGap=
    Math.max(
      15,
      W*0.012
    );


  const padding=
    Math.max(
      18,
      W*0.018
    );


  const innerW=
    panelW-padding*2;


  /*
    文字预先测量
  */

  targetCtx.font=
    `600 ${valueSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

  const contentLines=
    wrapLines(
      targetCtx,
      data.content,
      innerW-iconSize-10,
      2
    );


  targetCtx.font=
    `500 ${valueSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

  const locationLines=
    wrapLines(
      targetCtx,
      data.location,
      innerW-iconSize-10,
      2
    );


  targetCtx.font=
    `500 ${valueSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

  const coordinateLines=
    wrapLines(
      targetCtx,
      data.coordinates,
      innerW-iconSize-10,
      2
    );


  /*
    动态计算面板高度
  */

  const titleH=
    titleSize*1.15;

  const companyH=
    data.company
      ? companySize*1.2+10
      : 0;

  const contentH=
    Math.max(
      1,
      contentLines.length
    ) *
    valueSize*1.45;

  const locationH=
    Math.max(
      1,
      locationLines.length
    ) *
    valueSize*1.4;

  const coordinateH=
    Math.max(
      1,
      coordinateLines.length
    ) *
    valueSize*1.4;

  const infoH=
    valueSize*1.5;

  const footerH=
    valueSize*1.5;


  const panelH=
    padding+
    titleH+
    companyH+
    contentH+
    locationH+
    coordinateH+
    infoH+
    footerH+
    rowGap*4+
    padding;


  const panelX=left;

  const panelY=
    H-bottom-panelH;


  /*
    防止水印超过照片
  */

  const safePanelY=
    Math.max(
      H*0.45,
      panelY
    );


  /*
    半透明背景
  */

  targetCtx.save();

  targetCtx.fillStyle=
    'rgba(16,20,23,0.58)';

  targetCtx.beginPath();

  targetCtx.roundRect(
    panelX,
    safePanelY,
    panelW,
    panelH,
    Math.max(8,12*scale)
  );

  targetCtx.fill();


  /*
    极细边框
  */

  targetCtx.strokeStyle=
    'rgba(255,255,255,0.30)';

  targetCtx.lineWidth=
    Math.max(
      1,
      W*0.0007
    );

  targetCtx.stroke();


  /*
    左侧金色细线
  */

  targetCtx.fillStyle=GOLD;

  targetCtx.fillRect(
    panelX,
    safePanelY,
    Math.max(
      3,
      W*0.003
    ),
    panelH
  );


  let y=
    safePanelY+
    padding;


  /*
    标题
  */

  drawDocumentIcon(
    targetCtx,
    panelX+
    padding+
    iconSize/2,
    y+
    titleSize*.45,
    iconSize
  );


  targetCtx.font=
    `600 ${titleSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

  targetCtx.fillStyle=WHITE;

  targetCtx.textBaseline='alphabetic';

  targetCtx.fillText(
    '施工现场记录',
    panelX+
    padding+
    iconSize+
    10,
    y+titleSize
  );


  y+=titleH+8;


  /*
    公司名称
  */

  if(data.company){

    targetCtx.font=
      `500 ${companySize}px "PingFang SC","Microsoft YaHei",sans-serif`;

    targetCtx.fillStyle=
      'rgba(255,255,255,0.76)';


    const companyMax=
      innerW;


    let companyText=data.company;


    while(
      targetCtx.measureText(companyText).width>
      companyMax &&
      companyText.length>2
    ){

      companyText=
        companyText.slice(
          0,
          -1
        );

    }


    if(companyText!==data.company){

      companyText+='…';

    }


    targetCtx.fillText(
      companyText,
      panelX+padding,
      y+companySize
    );


    y+=companyH;

  }


  /*
    分隔线
  */

  targetCtx.strokeStyle=
    'rgba(255,255,255,0.18)';

  targetCtx.lineWidth=
    Math.max(
      1,
      W*0.0006
    );

  targetCtx.beginPath();

  targetCtx.moveTo(
    panelX+padding,
    y
  );

  targetCtx.lineTo(
    panelX+panelW-padding,
    y
  );

  targetCtx.stroke();


  y+=rowGap;


  /*
    通用行函数
  */

  function drawRow(
    iconFn,
    label,
    lines
  ){

    const rowTop=y;

    iconFn(
      targetCtx,
      panelX+
      padding+
      iconSize/2,
      rowTop+
      valueSize*.55,
      iconSize
    );


    targetCtx.font=
      `600 ${labelSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

    targetCtx.fillStyle=GOLD;

    const labelX=
      panelX+
      padding+
      iconSize+
      10;


    targetCtx.fillText(
      label,
      labelX,
      rowTop+
      labelSize
    );


    const labelWidth=
      targetCtx.measureText(label).width;


    const valueX=
      labelX+
      labelWidth+
      9;


    targetCtx.font=
      `500 ${valueSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

    targetCtx.fillStyle=
      'rgba(255,255,255,0.88)';


    const available=
      panelX+
      panelW-
      padding-
      valueX;


    let yy=
      rowTop+
      valueSize;


    lines.forEach((line,index)=>{

      /*
        如果一行过长，继续限制。
      */

      let txt=line;

      while(
        targetCtx.measureText(txt).width>
        available &&
        txt.length>1
      ){

        txt=
          txt.slice(
            0,
            -1
          );

      }


      if(txt!==line){

        txt+='…';

      }


      targetCtx.fillText(
        txt,
        valueX,
        yy
      );


      yy+=
        valueSize*1.35;

    });


    y=
      Math.max(
        yy,
        rowTop+
        valueSize*1.3
      )+
      rowGap;

  }


  /*
    施工内容
  */

  drawRow(
    drawClipboardIcon,
    '施工内容：',
    contentLines
  );


  /*
    施工地点
  */

  drawRow(
    drawLocationIcon,
    '施工地点：',
    locationLines
  );


  /*
    施工人数
  */

  drawRow(
    drawPeopleIcon,
    '施工人数：',
    [`${data.workers} 人`]
  );


  /*
    经纬度
  */

  drawRow(
    drawCoordinateIcon,
    '经纬度：',
    coordinateLines
  );


  /*
    时间与天气区域
    这里特意压缩间距
  */

  targetCtx.strokeStyle=
    'rgba(255,255,255,0.18)';

  targetCtx.beginPath();

  targetCtx.moveTo(
    panelX+padding,
    y-5
  );

  targetCtx.lineTo(
    panelX+panelW-padding,
    y-5
  );

  targetCtx.stroke();


  y+=7;


  /*
    时间
  */

  drawClockIcon(
    targetCtx,
    panelX+
    padding+
    iconSize/2,
    y+
    valueSize*.5,
    iconSize*.85
  );


  targetCtx.font=
    `500 ${valueSize}px "PingFang SC","Microsoft YaHei",sans-serif`;

  targetCtx.fillStyle=
    'rgba(255,255,255,0.82)';


  targetCtx.fillText(
    `${data.dateStr}  ${data.timeStr}`,
    panelX+
    padding+
    iconSize+
    10,
    y+valueSize
  );


  /*
    天气放右侧
  */

  const weatherLabel=
    (
      weatherTypes.find(
        w=>w.key===data.weather
      )||{}
    ).label||'';


  const weatherText=
    data.temp
      ? `${weatherLabel} ${data.temp}℃`
      : weatherLabel;


  targetCtx.font=
    `500 ${valueSize}px "PingFang SC","Microsoft YaHei",sans-serif`;


  const weatherWidth=
    targetCtx.measureText(
      weatherText
    ).width;


  const weatherIconR=
    Math.max(
      7,
      iconSize*.48
    );


  const weatherX=
    panelX+
    panelW-
    padding-
    weatherWidth;


  drawWeatherIcon(
    targetCtx,
    data.weather,
    weatherX-weatherIconR*1.8,
    y+valueSize*.55,
    weatherIconR,
    GOLD
  );


  targetCtx.fillText(
    weatherText,
    weatherX,
    y+valueSize
  );


  y+=
    footerH+
    8;


  /*
    公司签名
  */

  if(data.company){

    targetCtx.font=
      `500 ${companySize}px "PingFang SC","Microsoft YaHei",sans-serif`;

    targetCtx.fillStyle=
      'rgba(255,255,255,0.58)';


    const companyWidth=
      targetCtx.measureText(
        data.company
      ).width;


    let companyDisplay=
      data.company;


    if(companyWidth>innerW){

      while(
        targetCtx.measureText(
          companyDisplay+'…'
        ).width>innerW &&
        companyDisplay.length>1
      ){

        companyDisplay=
          companyDisplay.slice(
            0,
            -1
          );

      }

      companyDisplay+='…';

    }


    targetCtx.textAlign='center';

    targetCtx.fillText(
      companyDisplay,
      panelX+
      panelW/2,
      safePanelY+
      panelH-
      padding*.55
    );

    targetCtx.textAlign='left';

  }


  targetCtx.restore();

}


/* =========================================================
   示例底图
========================================================= */

function drawPlaceholder(
  c,
  W,
  H
){

  const g=
    c.createLinearGradient(
      0,
      0,
      W,
      H
    );

  g.addColorStop(
    0,
    '#4b5159'
  );

  g.addColorStop(
    1,
    '#171a1f'
  );

  c.fillStyle=g;

  c.fillRect(
    0,
    0,
    W,
    H
  );

}


/* =========================================================
   预览
========================================================= */

function renderPreview(){

  const data=getFormData();

  let W,H;

  if(
    activeIndex>=0 &&
    photos[activeIndex]
  ){

    const img=
      photos[activeIndex].img;

    W=img.naturalWidth;

    H=img.naturalHeight;

    canvas.width=W;

    canvas.height=H;

    drawWatermark(
      ctx,
      img,
      W,
      H,
      data
    );

  }

  else{

    W=1200;

    H=900;

    canvas.width=W;

    canvas.height=H;

    const tmp=
      document.createElement(
        'canvas'
      );

    tmp.width=W;

    tmp.height=H;

    const tc=
      tmp.getContext('2d');

    drawPlaceholder(
      tc,
      W,
      H
    );

    drawWatermark(
      ctx,
      tmp,
      W,
      H,
      data
    );

  }

}


/* =========================================================
   上传
========================================================= */

fileInput.onchange=function(e){

  const files=
    Array.from(
      e.target.files||[]
    );


  files.forEach(file=>{

    const reader=
      new FileReader();


    reader.onload=function(ev){

      const img=
        new Image();


      img.onload=function(){

        photos.push({
          img:img,
          name:file.name
        });


        if(activeIndex===-1){

          activeIndex=
            photos.length-1;

        }


        renderThumbs();

        renderPreview();

      };


      img.src=
        ev.target.result;

    };


    reader.readAsDataURL(file);

  });


  fileInput.value='';

};


/* =========================================================
   缩略图
========================================================= */

function renderThumbs(){

  thumbsEl.innerHTML='';


  photos.forEach(
    (p,i)=>{

      const d=
        document.createElement(
          'div'
        );

      d.className=
        'thumb '+
        (
          i===activeIndex
            ? 'active'
            : ''
        );


      const img=
        document.createElement(
          'img'
        );

      img.src=p.img.src;

      d.appendChild(img);


      const del=
        document.createElement(
          'div'
        );

      del.className='del';

      del.textContent='×';


      del.onclick=function(ev){

        ev.stopPropagation();

        photos.splice(i,1);


        if(
          activeIndex>=photos.length
        ){

          activeIndex=
            photos.length-1;

        }


        renderThumbs();

        renderPreview();

      };


      d.appendChild(del);


      d.onclick=function(){

        activeIndex=i;

        renderThumbs();

        renderPreview();

      };


      thumbsEl.appendChild(d);

    }
  );


  countPill.textContent=
    photos.length
      ? `已选择 ${photos.length} 张照片`
      : '';

}


/* =========================================================
   表单监听
========================================================= */

[
  'company',
  'content',
  'location',
  'workers',
  'coordinates',
  'temp',
  'date',
  'time'
].forEach(id=>{

  el(id).addEventListener(
    'input',
    renderPreview
  );

});


/* =========================================================
   当前日期时间
========================================================= */

function setNow(){

  const d=new Date();


  el('date').value=
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;


  el('time').value=
    `${pad(d.getHours())}:${pad(d.getMinutes())}`;

}


/* =========================================================
   下载
========================================================= */

el('downloadBtn').onclick=
async function(){

  if(photos.length===0){

    statusEl.textContent=
      '请先选择至少一张照片';

    return;

  }


  const data=getFormData();

  const btn=
    el('downloadBtn');

  btn.disabled=true;


  if(photos.length===1){

    statusEl.textContent=
      '正在生成…';


    const img=
      photos[0].img;


    const off=
      document.createElement(
        'canvas'
      );


    off.width=
      img.naturalWidth;

    off.height=
      img.naturalHeight;


    drawWatermark(
      off.getContext('2d'),
      img,
      off.width,
      off.height,
      data
    );


    off.toBlob(
      function(blob){

        const url=
          URL.createObjectURL(
            blob
          );


        const a=
          document.createElement(
            'a'
          );

        a.href=url;

        a.download=
          `施工记录_${data.dateStr.replace(/[年月日 ]/g,'')}_${data.timeStr.replace(':','')}.jpg`;

        a.click();


        setTimeout(
          ()=>URL.revokeObjectURL(url),
          1000
        );


        statusEl.textContent=
          '已下载';

        btn.disabled=false;

      },
      'image/jpeg',
      0.94
    );

  }

  else{

    for(
      let i=0;
      i<photos.length;
      i++
    ){

      statusEl.textContent=
        `正在下载 ${i+1}/${photos.length}…`;


      const img=
        photos[i].img;


      const off=
        document.createElement(
          'canvas'
        );


      off.width=
        img.naturalWidth;

      off.height=
        img.naturalHeight;


      drawWatermark(
        off.getContext('2d'),
        img,
        off.width,
        off.height,
        data
      );


      const blob=
        await new Promise(
          resolve=>
            off.toBlob(
              resolve,
              'image/jpeg',
              0.94
            )
        );


      const url=
        URL.createObjectURL(
          blob
        );


      const a=
        document.createElement(
          'a'
        );

      a.href=url;

      a.download=
        `施工记录_${i+1}_${data.timeStr.replace(':','')}.jpg`;

      a.click();


      setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
      );


      await new Promise(
        r=>setTimeout(r,350)
      );

    }


    statusEl.textContent=
      `已下载全部 ${photos.length} 张照片`;

    btn.disabled=false;

  }

};


/* =========================================================
   初始化
========================================================= */

buildWeatherGrid();

setNow();

renderPreview();

})();

</script>
